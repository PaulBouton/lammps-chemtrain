name: GitHub Actions merge

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-tests:
    name: Run Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Set up venv and run tests
        run: |
          cur_dir=$(pwd)/python_venv
          ./bash/setup_python_venv.bash $cur_dir cpu
          source $cur_dir/bin/activate
          pytest python/model-export/tests/test_export_model.py

  build-cpu-apptainer:
    name: Build CPU Apptainer image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Git LFS
        run: |
         git lfs install
         git lfs pull

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v3
        with:
          apptainer-version: latest

      - name: Build container
        run: ./bash/setup_apptainer.bash cpu 10
